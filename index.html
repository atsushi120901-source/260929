<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AURELIA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="district" class="panel"></div>
    <div id="stats" class="panel"></div>
    <canvas id="minimap" width="200" height="200"></canvas>
    <div id="prompt"></div>
    <div id="toast"></div>
    <div id="help" class="panel">
      <b>操作</b>
      <div>WASD 移動 ／ マウス 視点</div>
      <div>Shift ダッシュ ／ Space ジャンプ</div>
      <div>F ホバーポッド 乗る・降りる</div>
      <div>（ポッド）Space 上昇 ／ C 下降 ／ Shift ブースト</div>
      <div>T 時間帯 ／ R 雨 ／ B 発光 ／ G 影</div>
      <div>ホイール ズーム ／ H ヘルプ</div>
    </div>
  </div>

  <div id="start">
    <p class="eyebrow">空と海の未来都市</p>
    <h1>AURELIA</h1>
    <p class="lead">真珠色の塔とガラスのドームが夕暮れに輝く街、オーレリア。<br />海辺の広場から歩き出し、街に散らばる <span class="gold">ルミナ結晶</span> を集めながら、<br />雲の上にそびえるセレスティア・スパイアの頂上を目指そう。</p>
    <button id="startBtn">探検をはじめる</button>
    <p class="small">WASD 移動 ・ マウス 視点 ・ F ホバーポッド ・ H 操作一覧</p>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
