<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NEO CITY Explorer</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="district" class="panel"></div>
    <div id="stats" class="panel"></div>
    <canvas id="minimap" width="200" height="200"></canvas>
    <div id="prompt"></div>
    <div id="toast"></div>
    <div id="help" class="panel">
      <b>操作</b>
      <div>WASD 移動 / マウス 視点</div>
      <div>Shift ダッシュ / Space ジャンプ</div>
      <div>F ホバーカー 乗る・降りる</div>
      <div>（車）Space 上昇 / C 下降 / Shift ブースト</div>
      <div>T 時間帯 / R 雨 / B ブルーム</div>
      <div>ホイール ズーム / H ヘルプ</div>
    </div>
  </div>

  <div id="start">
    <h1>NEO CITY</h1>
    <p>果てなく続く未来都市を自由に探検しよう。<br />街に散らばる <span class="chip">データチップ</span> を集め、中心にそびえる<br />セントラル・スパイアを目指せ。</p>
    <button id="startBtn">クリックして開始</button>
    <p class="small">WASD 移動 ・ マウス 視点 ・ F ホバーカー ・ H 操作一覧</p>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
